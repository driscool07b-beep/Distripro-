[build]
  command = "npm run build"
  publish = "dist"

# Indispensable pour une SPA (React Router) : sans ça, recharger une
# page autre que l'accueil (ex. /ventes) renverrait une erreur 404,
# puisque Netlify chercherait un vrai fichier /ventes qui n'existe pas.
# Un fichier /assets/... introuvable (ancienne version) doit renvoyer une
# vraie erreur 404, pas la page d'accueil déguisée en script.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et la page d'accueil ne doivent jamais être gardés en
# cache par le navigateur : sinon l'application installée peut rester des
# heures sur une ancienne version après une mise en ligne.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
