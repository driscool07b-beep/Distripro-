[build]
  command = "npm run build"
  publish = "dist"
  # Économie de crédits : pas de mise en ligne (15 crédits) quand un envoi
  # GitHub ne touche pas l'application — par ex. seulement des scripts SQL ou
  # des fonctions serveur Supabase (dossier supabase/), déployées à part.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js netlify.toml"

# Indispensable pour une SPA (React Router) : sans ça, recharger une
# page autre que l'accueil (ex. /ventes) renverrait une erreur 404,
# puisque Netlify chercherait un vrai fichier /ventes qui n'existe pas.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et la page d'accueil ne doivent jamais être gardés en
# cache par le navigateur : sinon l'application installée peut rester des
# heures sur une ancienne version après une mise en ligne.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
