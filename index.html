<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DistribPro — Gestion commerciale</title>
    <meta name="theme-color" content="#0d2830" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Filet de sécurité : si l'application ne s'est pas affichée au bout de
      // 12 s (fichiers d'une ancienne version introuvables…), on vide le cache
      // de l'application et on recharge — une seule fois.
      setTimeout(function () {
        var racine = document.getElementById('root')
        if (racine && racine.children.length > 0) return
        if (sessionStorage.getItem('distribpro-reparation')) return
        sessionStorage.setItem('distribpro-reparation', '1')
        var taches = []
        if ('serviceWorker' in navigator) {
          taches.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister() }))
          }))
        }
        if (window.caches) {
          taches.push(caches.keys().then(function (cles) {
            return Promise.all(cles.map(function (c) { return caches.delete(c) }))
          }))
        }
        Promise.all(taches).finally(function () { location.reload() })
      }, 12000)
      window.addEventListener('load', function () {
        setTimeout(function () {
          var racine = document.getElementById('root')
          if (racine && racine.children.length > 0) sessionStorage.removeItem('distribpro-reparation')
        }, 3000)
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
